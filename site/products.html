/* Premium product directory — visual layer only; product data and copy remain unchanged. */
.product-directory{
  position:relative;
  padding-top:72px;
  background:
    radial-gradient(circle at 8% 8%,rgba(0,99,154,.07),transparent 24%),
    radial-gradient(circle at 92% 28%,rgba(17,45,66,.06),transparent 28%);
}
.product-directory:before{
  content:"";
  position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,#0b628f 18%,#0b628f 82%,transparent);
  opacity:.35;
}
.product-toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(320px,420px);
  gap:40px;align-items:end;margin-bottom:28px;
}
.product-toolbar h2{font-size:34px;letter-spacing:-.035em;margin:8px 0 0}
.product-search{
  min-width:0;padding:7px 7px 7px 16px;border:1px solid rgba(9,50,73,.13);
  border-radius:14px;background:rgba(255,255,255,.78);
  box-shadow:0 10px 35px rgba(12,40,58,.07);
  backdrop-filter:blur(10px);
}
.product-search span{
  display:block;font:700 10px/1.2 Inter,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:#71818d;margin:3px 0 7px;
}
.product-search input{
  width:100%;box-sizing:border-box;padding:10px 10px 10px 0;border:0;outline:0;
  background:transparent;color:#102b3d;font:500 15px "Noto Sans TC",sans-serif;
}
.product-search input::placeholder{color:#9aa7b0}
.category-tabs,.subcategory-tabs{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 14px}
.category-tab,.subcategory-tab{
  border:1px solid rgba(16,56,78,.13);background:rgba(255,255,255,.82);color:#263d4d;
  border-radius:999px;padding:11px 17px;cursor:pointer;font:600 14px "Noto Sans TC",sans-serif;
  box-shadow:0 4px 14px rgba(20,40,60,.035);transition:all .22s ease;
}
.category-tab.active,.subcategory-tab.active{
  background:#10283a;color:#fff;border-color:#10283a;
  box-shadow:0 9px 22px rgba(16,40,58,.18);
}
.category-tab:hover,.subcategory-tab:hover{transform:translateY(-1px);border-color:#0b628f;color:#075b86}
.category-tab.active:hover,.subcategory-tab.active:hover{color:#fff;background:#12374d;border-color:#12374d}
.subcategory-wrap{
  min-height:48px;margin:16px 0 28px;padding:18px 20px;
  border:1px solid rgba(15,53,75,.10);border-radius:18px;
  background:linear-gradient(135deg,rgba(247,250,251,.96),rgba(239,245,248,.82));
  box-shadow:inset 0 1px rgba(255,255,255,.9),0 10px 30px rgba(20,45,65,.045);
}
.subcategory-title{
  font-size:11px;font-weight:800;letter-spacing:.16em;color:#6e808c;
  margin-bottom:11px;text-transform:uppercase;
}
.product-directory-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;
}
.real-product-card{
  position:relative;overflow:hidden;border:1px solid rgba(12,51,72,.12);
  border-radius:20px;background:#fff;display:flex;flex-direction:column;
  box-shadow:0 12px 36px rgba(18,43,61,.07);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}
.real-product-card:before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#0b628f,#7faabd,transparent);
  opacity:.7;z-index:2;
}
.real-product-card:hover{
  transform:translateY(-5px);border-color:rgba(0,99,154,.25);
  box-shadow:0 20px 48px rgba(15,48,68,.13);
}
.real-product-card .product-photo{
  height:245px;
  background:
    radial-gradient(circle at 70% 28%,rgba(104,155,181,.18),transparent 25%),
    linear-gradient(145deg,#eef3f6,#f9fbfc 48%,#e6edf1);
  display:flex;align-items:center;justify-content:center;padding:24px;
  box-sizing:border-box;position:relative;overflow:hidden;
}
.real-product-card .product-photo:before{
  content:"";position:absolute;inset:14px;
  border:1px solid rgba(0,99,154,.09);border-radius:14px;
  background:
    linear-gradient(90deg,transparent 49.8%,rgba(0,99,154,.035) 50%,transparent 50.2%),
    linear-gradient(0deg,transparent 49.8%,rgba(0,99,154,.035) 50%,transparent 50.2%);

}
.real-product-card .product-photo:after{
  content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(0,99,154,.09);

}
.real-product-card .product-photo img{

  transition:transform .3s ease;
}
.real-product-card:hover .product-photo img{transform:scale(1.025)}
.real-product-body{padding:23px 23px 21px;position:relative}
.real-product-body h3{

}
.real-product-body p{
  margin:0;color:#62727e;line-height:1.82;white-space:pre-line;font-size:14px;
}
.product-description .desc-line{
  display:block;position:relative;padding-left:0;margin:0 0 10px;
}
.product-description .desc-line:last-child{margin-bottom:0}
.product-description .desc-line.has-bullet{padding-left:19px}
.product-description .desc-line.has-bullet:before{
  content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;
  background:#0b628f;box-shadow:0 0 0 4px rgba(11,98,143,.08);
}
.product-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.product-chip{
  font-size:10px;font-weight:700;letter-spacing:.06em;padding:6px 10px;border-radius:999px;
  background:#edf4f7;color:#35657c;border:1px solid rgba(11,98,143,.08);
}
.product-actions{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:22px;padding-top:15px;border-top:1px solid #edf1f3;
}
.product-actions a{
  font-size:13px;text-decoration:none;font-weight:700;color:#096593;
  transition:transform .2s ease,color .2s ease;
}
.product-actions a:hover{color:#073f5b;transform:translateX(2px)}
.product-empty{
  padding:56px;text-align:center;color:#667085;border:1px dashed #cbd6dd;
  border-radius:18px;background:rgba(255,255,255,.65)
}
.count-note{
  color:#71808b;font-size:13px;margin:10px 0 24px;padding-left:2px;
}
.slim-cta{position:relative}
@media(max-width:900px){
  .product-directory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .product-toolbar{grid-template-columns:1fr;align-items:stretch;gap:20px}
  .product-search{min-width:0}
}
@media(max-width:600px){
  .product-directory{padding-top:52px}
  .product-directory-grid{grid-template-columns:1fr}

  .real-product-card .product-photo{height:220px}
  .product-toolbar h2{font-size:28px}
}
/* Bullet rendering fix: the original "●" is text data, while the left dot is the UI marker. Show only one dot. */
.product-description .desc-line:not(.has-bullet)::before{content:none!important;display:none!important}
.product-description .desc-line.has-bullet{padding-left:19px}

const PRODUCT_DESCRIPTION_TRANSLATIONS={"p01":{"zh-CN":"● 该系列可对整个可见光和近红外线、紫外线范围内的色差进行校正，同时提高近红外线及紫外线范围内的透射率。","en":"● This series corrects chromatic aberration across the visible, near-infrared, and ultraviolet ranges while improving transmittance in the near-infrared and ultraviolet ranges.","ja":"● 可視光、近赤外線、紫外線の全域で色収差を補正し、近赤外線および紫外線域の透過率も向上させます。"},"p02":{"zh-CN":"● 特点说明:\n\nMT-1,2,40：可见光波长\n\n范围（435.8-656.3nm）\n\nMT-L：近紫外线（355nm）\n\n至近红外线（1064nm）\n\nMT-L4：紫外线（266nm）\n\n至可见光（620nm）","en":"● Features:\n\nMT-1,2,40: Visible wavelength\n\nrange (435.8-656.3nm)\n\nMT-L: Near-ultraviolet (355nm)\n\nto near-infrared (1064nm)\n\nMT-L4: Ultraviolet (266nm)\n\nto visible (620nm)","ja":"● 特長:\n\nMT-1,2,40：可視光波長\n\n範囲（435.8-656.3nm）\n\nMT-L：近紫外線（355nm）\n\n～近赤外線（1064nm）\n\nMT-L4：紫外線（266nm）\n\n～可視光（620nm）"},"p03":{"zh-CN":"● 该系列可对整个可见光和近红外线、紫外线范围内的色差进行校正，同时提高近红外线及紫外线范围内的透射率。","en":"● This series corrects chromatic aberration across the visible, near-infrared, and ultraviolet ranges while improving transmittance in the near-infrared and ultraviolet ranges.","ja":"● 可視光、近赤外線、紫外線の全域で色収差を補正し、近赤外線および紫外線域の透過率も向上させます。"},"p04":{"zh-CN":"M Plan Apo系列产品本身具有完整的光学系统。通常，增加物镜的工作距离会导致多种色差问题。M Plan Apo系列的复消色差透镜通过选用低折射率反常色散玻璃和超低色散玻璃，实现大范围可见光的色差校正。这两种玻璃的波长折射率不同于普通光学玻璃。","en":"The M Plan Apo series has a complete optical system. Increasing the working distance of an objective lens can normally cause various chromatic aberration issues. The M Plan Apo series uses low-refractive-index anomalous-dispersion glass and ultra-low-dispersion glass to correct chromatic aberration across a wide visible-light range. These glasses have wavelength-dependent refractive indices different from ordinary optical glass.","ja":"M Plan Apoシリーズは、それ自体で完全な光学系を構成しています。通常、対物レンズの作動距離を長くすると、さまざまな色収差が発生します。M Plan Apoシリーズは、低屈折率異常分散ガラスと超低分散ガラスを採用した複消色レンズにより、広い可視光域で色収差を補正します。これらのガラスは一般的な光学ガラスとは異なる波長分散特性を持ちます。"},"p05":{"zh-CN":"● M Plan Apo系列产品本身具有完整的光学系统。通常，增加物镜的工作距离会导致多种色差问题。M Plan Apo系列的复消色差透镜通过选用低折射率反常色散玻璃和超低色散玻璃，实现大范围可见光的色差校正。这两种玻璃的波长折射率不同于普通光学玻璃。","en":"● The M Plan Apo series has a complete optical system. Increasing the working distance of an objective lens can normally cause various chromatic aberration issues. The series uses low-refractive-index anomalous-dispersion glass and ultra-low-dispersion glass to correct chromatic aberration across a wide visible-light range. These glasses have wavelength-dependent refractive indices different from ordinary optical glass.","ja":"● M Plan Apoシリーズは、それ自体で完全な光学系を構成しています。通常、対物レンズの作動距離を長くすると、さまざまな色収差が発生します。低屈折率異常分散ガラスと超低分散ガラスを採用し、広い可視光域で色収差を補正します。これらのガラスは一般的な光学ガラスとは異なる波長分散特性を持ちます。"},"p06":{"zh-CN":"● 该系列可对整个可见光和近红外线、紫外线范围内的色差进行校正，同时提高近红外线及紫外线范围内的透射率。","en":"● This series corrects chromatic aberration across the visible, near-infrared, and ultraviolet ranges while improving transmittance in the near-infrared and ultraviolet ranges.","ja":"● 可視光、近赤外線、紫外線の全域で色収差を補正し、近赤外線および紫外線域の透過率も向上させます。"},"p07":{"zh-CN":"● 工件摆放完成后，点击测量按钮即可立即完成测量。\n\n● 测量结果及公差判定一目了然，可立即判定OK及NG。\n\n● 搭载图像式操作引导说明功能。","en":"● After the workpiece is positioned, click the measurement button to complete the measurement immediately.\n\n● Measurement results and tolerance judgments are easy to see, with immediate OK/NG judgment.\n\n● Includes image-based operation guidance.","ja":"● ワークをセットした後、測定ボタンをクリックするだけですぐに測定できます。\n\n● 測定結果と公差判定を一目で確認でき、OK/NGを即座に判定します。\n\n● 画像による操作ガイド機能を搭載しています。"},"p08":{"zh-CN":"● 工件摆放完成后，点击测量按钮即可立即完成测量。\n\n● 测量结果及公差判定一目了然，可立即判定OK及NG。\n\n● 搭载图像式操作引导说明功能。","en":"● After the workpiece is positioned, click the measurement button to complete the measurement immediately.\n\n● Measurement results and tolerance judgments are easy to see, with immediate OK/NG judgment.\n\n● Includes image-based operation guidance.","ja":"● ワークをセットした後、測定ボタンをクリックするだけですぐに測定できます。\n\n● 測定結果と公差判定を一目で確認でき、OK/NGを即座に判定します。\n\n● 画像による操作ガイド機能を搭載しています。"},"p09":{"zh-CN":"1～2倍变焦镜头及超长工作距离物镜SL200X与10倍目镜组合，因此总倍率可进行2000～8000倍的放大观察。","en":"With a 1–2× zoom lens, the SL200X ultra-long working-distance objective, and a 10× eyepiece, the total magnification can reach 2000–8000× for enlarged observation.","ja":"1～2倍ズームレンズ、超長作動距離対物レンズSL200X、10倍接眼レンズの組み合わせにより、総合倍率2000～8000倍で観察できます。"},"p10":{"zh-CN":"● 配备抑制闪烁的全新光学系统。\n\n● 使用高NA物镜（长工作距离），支持4000X目镜观察。\n\n● 可调光圈将光路内的杂散光降至最低。","en":"● A new optical system with flicker suppression.\n\n● Uses a high-NA objective with a long working distance and supports 4000× eyepiece observation.\n\n● An adjustable aperture minimizes stray light in the optical path.","ja":"● フリッカーを抑制する新しい光学系を採用しています。\n\n● 高NA・長作動距離の対物レンズを使用し、4000倍接眼レンズでの観察に対応します。\n\n● 可変絞りにより光路内の迷光を最小限に抑えます。"},"p11":{"zh-CN":"小巧、轻量且易于安装的显微镜，用于半导体制造时的CCD监视器。\n\n相比一般VMU，拥有更广泛的观察范围，检查速度更快，从而提升设备处理速度。\n\n适用于F MOUNT、CCD。","en":"A compact, lightweight and easy-to-install microscope for CCD monitors used in semiconductor manufacturing.\n\nCompared with standard VMU models, it provides a wider observation range, enabling faster inspection and higher equipment throughput.\n\nCompatible with F MOUNT and CCD.","ja":"半導体製造時のCCDモニターに使用する、小型・軽量で取り付けやすい顕微鏡です。\n\n一般的なVMUより広い観察範囲を持ち、検査速度を高めて設備の処理能力を向上させます。\n\nF MOUNT、CCDに対応します。"},"p12":{"zh-CN":"小巧、轻量且易于安装的显微镜，用于半导体制造时的CCD监视器。\n\n轻量、小型显微镜可搭配各种专用检查装置，用于观察或激光加工。","en":"A compact, lightweight and easy-to-install microscope for CCD monitors used in semiconductor manufacturing.\n\nThe lightweight, compact microscope can be integrated into various dedicated inspection systems for observation or laser processing.","ja":"半導体製造時のCCDモニターに使用する、小型・軽量で取り付けやすい顕微鏡です。\n\n軽量・小型のため、さまざまな専用検査装置に組み込み、観察やレーザー加工に使用できます。"},"p13":{"zh-CN":"● 适用于小型物品的小型高精度真圆度、圆筒形状测定机。\n\n● 转台采用空气轴承驱动。","en":"● A compact, high-precision roundness and cylindrical-form measuring machine for small workpieces.\n\n● The rotary table is driven by an air bearing.","ja":"● 小型ワークに適した小型・高精度の真円度・円筒形状測定機です。\n\n● 回転テーブルにはエアベアリング駆動を採用しています。"},"p14":{"zh-CN":"● 配备高速自动调心、调水平功能。\n\n● 采用FEM分析结构设计，以高层次同时实现世界最高精度等级、高操作性和高解析能力的程序组合，满足高精度测量需求。","en":"● Equipped with high-speed automatic centering and leveling functions.\n\n● FEM-analyzed structural design achieves a high level of precision together with excellent operability and high-resolution measurement programs to meet high-precision measurement needs.","ja":"● 高速自動調心・自動レベリング機能を搭載しています。\n\n● FEM解析による構造設計を採用し、世界最高水準の精度と高い操作性・高分解能を両立したプログラム構成で、高精度測定の要求に応えます。"},"p15":{"zh-CN":"● 节省空间的设计。\n\n● 配备安全机制。\n\n● 高精度转台。","en":"● Space-saving design.\n\n● Equipped with safety mechanisms.\n\n● High-precision rotary table.","ja":"● 省スペース設計。\n\n● 安全機構を搭載しています。\n\n● 高精度回転テーブル。"},"p16":{"zh-CN":"● 通过上下表面连续测量功能，可以轻松测量上表面和下表面。","en":"● Continuous measurement of the upper and lower surfaces makes it easy to measure both surfaces.","ja":"● 上下面を連続して測定できる機能により、上面と下面を簡単に測定できます。"},"p17":{"zh-CN":"● 全新进化的小型表面粗糙度测定机。\n\n● 提供更丰富的选项、操作更简单、测量更精准。","en":"● A newly evolved compact surface roughness measuring machine.\n\n● More options, easier operation, and more precise measurement.","ja":"● さらに進化した小型表面粗さ測定機です。\n\n● 豊富なオプション、より簡単な操作、より高精度な測定を実現します。"},"p18":{"zh-CN":"● 提升使用便利性，功能更多！\n\n● 结合新的选配组合，可实现更高的处理能力。","en":"● Improved usability with more functions.\n\n● New optional combinations enable higher processing capability.","ja":"● 使いやすさを向上し、機能をさらに充実させています。\n\n● 新しいオプション構成との組み合わせにより、より高い処理能力を実現します。"},"p19":{"zh-CN":"● 1064nm波长高功率激光模块\n\n● 光罩线路及金属性污点修补","en":"● High-power laser module with a 1064nm wavelength.\n\n● Repair of mask circuits and metallic defects.","ja":"● 1064nm波長の高出力レーザーモジュール。\n\n● フォトマスクの回路および金属汚点の修復に対応します。"},"p20":{"zh-CN":"● 检测功能：利用特殊光学技术穿透硅晶圆并完整呈现，防止不良发生。\n\n● 适合半导体行业检测使用，如si interposer、TSV、Bumping、Flip chip、FC-CSP、FC-BGA、MEMS、WLC-SP及封装后成品等。","en":"● Inspection function: special optics penetrate silicon wafers and provide a complete view to help prevent defects.\n\n● Suitable for semiconductor inspection, including Si interposer, TSV, bumping, flip chip, FC-CSP, FC-BGA, MEMS, WLC-SP, and post-package products.","ja":"● 検査機能：特殊光学系によりシリコンウェーハを透過して内部を鮮明に観察し、不良の発生を防止します。\n\n● Siインターポーザ、TSV、バンピング、フリップチップ、FC-CSP、FC-BGA、MEMS、WLC-SP、パッケージ後製品など、半導体業界の検査に適しています。"},"p21":{"zh-CN":"● 采用FEM分析技术，具有高级感的全新设计，本体及外观尽可能采用一体成型方式制作，并提供丰富的测头系统供选择搭配。\n\n● 实现静音、高速驱动和高速加速性能。","en":"● Uses FEM analysis technology and a sophisticated new design. The body and exterior are manufactured as much as possible as an integrated structure, with a wide range of probe systems available.\n\n● Provides quiet operation, high-speed drive, and high acceleration.","ja":"● FEM解析技術を採用した洗練された新設計で、本体・外観には可能な限り一体成形構造を採用し、豊富なプローブシステムから選択できます。\n\n● 静音運転、高速駆動、高速加速を実現します。"},"p22":{"zh-CN":"● 为提高机身刚性而重新设计机身结构，以确保高速、高精度测量。\n\n● 通过新开发的高刚性结构设计结合补偿技术，实现高性能扫描测量。\n\n● 超高精度线性尺为各轴提供更高分辨率、精度及整体性能。","en":"● The machine structure has been redesigned for higher rigidity to ensure high-speed, high-precision measurement.\n\n● A newly developed high-rigidity structure combined with compensation technology enables high-performance scanning measurement.\n\n● Ultra-high-precision linear scales provide higher resolution, accuracy, and overall performance for each axis.","ja":"● 本体剛性を高めるために構造を再設計し、高速・高精度測定を実現します。\n\n● 新開発の高剛性構造と補正技術を組み合わせ、高性能なスキャン測定を実現します。\n\n● 超高精度リニアスケールにより、各軸の分解能・精度・総合性能を向上させます。"},"p23":{"zh-CN":"● 可搭载激光或接触式测头。\n\n● X轴最大行程可达2000mm。\n\n● 用于电子零件测量的影像测定机。","en":"● Can be equipped with laser or contact probes.\n\n● Maximum X-axis travel up to 2000mm.\n\n● A vision measuring machine for electronic component measurement.","ja":"● レーザーまたは接触式プローブを搭載できます。\n\n● X軸最大ストロークは2000mmです。\n\n● 電子部品の測定に適した画像測定機です。"},"p24":{"zh-CN":"● STREAM模式高速测量。\n\n● 新开发高亮度LED照明。","en":"● High-speed measurement in STREAM mode.\n\n● Newly developed high-brightness LED illumination.","ja":"● STREAMモードによる高速測定。\n\n● 新開発の高輝度LED照明を搭載しています。"},"p25":{"zh-CN":"● 测微器。\n\n● 由于产品种类众多，如需报价，敬请来电。","en":"● Micrometers.\n\n● As many product types are available, please contact us for a quotation.","ja":"● マイクロメータ。\n\n● 製品種類が多数あるため、お見積りをご希望の場合はお問い合わせください。"},"p26":{"zh-CN":"● 测微头。\n\n● 由于产品种类众多，如需报价，敬请来电。","en":"● Micrometer heads.\n\n● As many product types are available, please contact us for a quotation.","ja":"● マイクロメータヘッド。\n\n● 製品種類が多数あるため、お見積りをご希望の場合はお問い合わせください。"},"p27":{"zh-CN":"● 各式量表／数字量表。\n\n● 由于产品种类众多，如需报价，敬请来电。","en":"● Various dial gauges / digital indicators.\n\n● As many product types are available, please contact us for a quotation.","ja":"● 各種ダイヤルゲージ／デジタルゲージ。\n\n● 製品種類が多数あるため、お見積りをご希望の場合はお問い合わせください。"},"p28":{"zh-CN":"游标卡尺。","en":"Vernier caliper.","ja":"ノギス。"}};

function productName(product){
  const lang=localStorage.getItem('yofeng-lang')||'zh-TW';
  return PRODUCT_NAME_TRANSLATIONS[product.id]?.[lang] ?? product.name;
}
function renderDescription(text, productId){const lang=localStorage.getItem('yofeng-lang')||'zh-TW';const translated=PRODUCT_DESCRIPTION_TRANSLATIONS[productId]?.[lang];const source=translated??text;return source.split(/\n\s*\n/).map(block=>{let t=block.trim();if(!t)return '';t=t.replace(/^●\s?/,'');const safe=esc(t);return `<span class="desc-line has-bullet">${safe}</span>`;}).filter(Boolean).join('')}
function renderProducts(){const q=query.trim().toLowerCase();const list=PRODUCTS.filter(p=>(activeCat==='ALL'||p.cat===activeCat)&&(activeSub==='ALL'||p.sub===activeSub)&&(!q||(p.name+' '+p.cat+' '+p.sub+' '+p.desc).toLowerCase().includes(q)));const countTemplate=productT('productDirectory.count','目前顯示 {shown} / {total} 項產品');countNote.textContent=countTemplate.replace('{shown}',list.length).replace('{total}',PRODUCTS.length);grid.innerHTML=list.map(p=>`<article class="real-product-card"><div class="product-photo"><img src="assets/products/${p.img}" alt="${esc(productName(p))}" loading="lazy"></div><div class="real-product-body"><div class="product-meta"><span class="product-chip">${esc(productLabel('category',p.cat))}</span><span class="product-chip">${esc(productLabel('sub',p.sub))}</span></div><h3>${esc(productName(p))}</h3><p class="product-description">${renderDescription(p.desc||'請洽友豐貿易取得詳細產品資訊。', p.id)}</p><div class="product-actions">${p.pdf?`<a class="text-link" href="assets/products/${p.pdf}" target="_blank" rel="noopener">${esc(productT('productDirectory.catalog','查看型錄 →'))}</a>`:''}<a class="text-link" href="contact.html">${esc(productT('productDirectory.inquiry','詢問產品 →'))}</a></div></div></article>`).join('');empty.hidden=list.length>0;empty.textContent=productT('productDirectory.empty','找不到符合條件的產品。')}
function renderAll(){renderCategoryTabs();renderSubTabs();renderProducts()}
window.refreshProductDirectoryLanguage=function(){renderAll()}
search.addEventListener('input',e=>{query=e.target.value;renderProducts()});renderAll();</script><script src="script.js"></script></body></html>
